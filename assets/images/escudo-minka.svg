    <path d="M179 137 Q198 128 192 115 Q178 120 179 137 M176 152 Q197 145 192 133 Q176 136 176 152 M168 167 Q189 163 187 149 Q170 151 168 167 M152 181 Q174 183 175 169 Q160 166 152 181 M181 132 Q182 114 168 111 Q166 125 181 132 M177 150 Q176 130 161 130 Q161 145 177 150 M166 166 Q164 148 149 149 Q150 162 166 166"/>
  </g>
  <circle cx="23" cy="125" r="4" fill="#c96836"/><circle cx="217" cy="125" r="4" fill="#c96836"/>
</svg>
